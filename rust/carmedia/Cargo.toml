[package]
name = "forzabot-carmedia"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
forzabot-database = { path = "../database" }
