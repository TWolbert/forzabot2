[package]
name = "forzabot-dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
dioxus = { version = "0.6", features = ["web", "router"] }
gloo-net = "0.6"
gloo-storage = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
